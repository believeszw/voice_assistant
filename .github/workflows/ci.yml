name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (no audio)
        run: pytest -m "not audio"

  # Windows 全量回归需要声卡/COM，放在本机 `tools/run_regress.bat` 里跑，
  # 不适合放进公共 CI（GitHub 的 Windows runner 也没有麦克风）。
